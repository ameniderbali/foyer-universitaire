<main class="main-login">
        <div class="btn-login">
            <h1>Welcome to F-U<br>Please Login</h1>
        </div>

        <div class="right-login">
            <div class="card-login">
                <h1>Login Page</h1>
                <div class="textfield">
                    <label for="user">User</label>
                    <input type="text" [formControl]="userName" name="user">
                </div>

                <div class="textfield">
                    <label for="password">Password</label>
                    <input type="password" [formControl]="password" name="password">
                </div>

                <button class="btn-login" (click)="onLogin()">Login</button>
            </div>
        </div>
    </main>
